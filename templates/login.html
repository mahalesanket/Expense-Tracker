{% extends "base.html" %}
{% block title %}Login — Finance Tracker{% endblock %}

{% block auth_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 1.5rem;">Welcome Back</h2>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div style="margin-bottom: 1rem;">
                <label>Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label>Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
