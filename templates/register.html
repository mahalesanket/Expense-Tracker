{% extends "base.html" %}
{% block title %}Register — Finance Tracker{% endblock %}

{% block auth_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2rem;">
        <h2 style="margin-bottom: 0.5rem; text-align: center;">Create Account</h2>
        <p style="color: #64748b; font-size: 0.875rem; text-align: center; margin-bottom: 1.5rem;">Choose your preferred sign-up method</p>

        <!-- OAuth Action Buttons -->
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
            <button id="googleSignIn" type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; border: 1px solid #cbd5e1; background: #fff; padding: 0.625rem; border-radius: 6px; cursor: pointer; font-weight: 500;">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.98 10.98 0 001 12c0 1.77.42 3.44 1.18 4.94l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 0 3.99 3.47 2.18 7.06L5.84 9.9c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <button id="githubSignIn" type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; border: 1px solid #cbd5e1; background: #24292f; color: #fff; padding: 0.625rem; border-radius: 6px; cursor: pointer; font-weight: 500;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.37 6.84 9.72.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.38-3.37-1.38-.45-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.15-4.55-5.08 0-1.12.39-2.03 1.02-2.75-.1-.26-.44-1.3.1-2.7 0 0 .83-.27 2.75 1.05A9.2 9.2 0 0 1 12 7.11c.85 0 1.71.12 2.51.36 1.92-1.32 2.75-1.05 2.75-1.05.54 1.4.2 2.44.1 2.7.63.72 1.02 1.63 1.02 2.75 0 3.94-2.34 4.81-4.57 5.07.36.32.68.95.68 1.92v2.85c0 .27.18.59.69.49A10.28 10.28 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
                </svg>
                <span>Continue with GitHub</span>
            </button>
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
            <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
            <span style="padding: 0 0.5rem; color: #94a3b8; font-size: 0.75rem;">OR FILL FORM</span>
            <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
        </div>

        <!-- Standard Form Registration -->
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">Full Name</label>
                <input type="text" name="full_name" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">Confirm Password</label>
                <input type="password" name="confirm_password" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.625rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Register with Email</button>
        </form>

        <p id="oauth-error" style="color: #dc2626; font-size: 0.875rem; text-align: center; margin-top: 1rem;"></p>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: #2563eb; text-decoration: none;">Log In</a>
        </p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { 
        getAuth, 
        GoogleAuthProvider, 
        GithubAuthProvider, 
        signInWithPopup,
        fetchSignInMethodsForEmail,
        linkWithCredential
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDFOuLimepOZkKN3hqGvp68_nN1EpD4a70",
        authDomain: "expense-tracker-3cacd.firebaseapp.com",
        projectId: "expense-tracker-3cacd",
        storageBucket: "expense-tracker-3cacd.firebasestorage.app",
        messagingSenderId: "678988500048",
        appId: "1:678988500048:web:2ce5514aec0149bc1d9555"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: "select_account" });

    const githubProvider = new GithubAuthProvider();
    githubProvider.setCustomParameters({ prompt: "select_account" });

    const errorElement = document.getElementById("oauth-error");

    async function sendTokenToBackend(user, providerName) {
        const response = await fetch("{{ url_for('auth.firebase_login') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: user.email,
                full_name: user.displayName || `${providerName} User`,
                provider: providerName
            })
        });

        const resData = await response.json();
        if (resData.success) {
            window.location.href = resData.redirect_url;
        } else {
            errorElement.textContent = resData.message || "Authentication failed.";
        }
    }

    async function handleOAuthSignIn(provider, providerName) {
        try {
            errorElement.textContent = "";
            const result = await signInWithPopup(auth, provider);
            await sendTokenToBackend(result.user, providerName);

        } catch (err) {
            console.error("Auth Error Code:", err.code);

            // Handle existing account with different credentials
            if (err.code === 'auth/account-exists-with-different-credential') {
                const pendingCred = GithubAuthProvider.credentialFromError(err) || GoogleAuthProvider.credentialFromError(err);
                const email = err.customData.email;

                errorElement.textContent = `An account already exists with ${email}. Authenticating to link accounts...`;

                // Fetch methods associated with this email
                const methods = await fetchSignInMethodsForEmail(auth, email);
                
                let originalProvider;
                if (methods.includes('google.com')) {
                    originalProvider = googleProvider;
                } else if (methods.includes('github.com')) {
                    originalProvider = githubProvider;
                }

                if (originalProvider) {
                    // Authenticate with the primary account
                    const result = await signInWithPopup(auth, originalProvider);
                    
                    // Link the secondary credential to the logged-in user
                    const userCredential = await linkWithCredential(result.user, pendingCred);
                    
                    // Complete Flask session initialization
                    await sendTokenToBackend(userCredential.user, providerName);
                }
            } else {
                errorElement.textContent = err.message;
            }
        }
    }

    document.getElementById("googleSignIn").addEventListener("click", () => handleOAuthSignIn(googleProvider, "google"));
    document.getElementById("githubSignIn").addEventListener("click", () => handleOAuthSignIn(githubProvider, "github"));
</script>
{% endblock %}
